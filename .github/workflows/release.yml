name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    name: 'Build Multiplatform (${{ matrix.platform }})'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux configuration (Ubuntu x86_64: Deb & AppImage)
          - platform: 'ubuntu-22.04'
            args: ''
            rust-target: 'x86_64-unknown-linux-gnu'

          # macOS configuration (Apple Silicon + Intel universal binary)
          - platform: 'macos-15'
            args: '--target universal-apple-darwin'
            rust-target: 'aarch64-apple-darwin,x86_64-apple-darwin'

          # Windows configuration (Windows x86_64: NSIS)
          - platform: 'windows-latest'
            args: ''
            rust-target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun runner environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install Rust toolchain with required compilation targets
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Cache Rust dependencies and build artifacts
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Linux system dependencies required by Tauri v2, WebKit, AppImage, and Debian bundling
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            rpm \
            patchelf

      # Install frontend dependencies using Bun
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Build the application and generate release bundles (.deb, .AppImage, .dmg, .exe)
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Docker Lite ${{ github.ref_name }}'
          releaseBody: 'Automated release generated for ${{ github.ref_name }}.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-snap:
    name: 'Build & Publish Snap (Ubuntu Store)'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the Snap package using Snapcraft
      - name: Build Snap package
        uses: snapcore/action-build@v1
        id: snapcraft

      # Upload the .snap file as a workflow artifact
      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-lite-snap
          path: ${{ steps.snapcraft.outputs.snap }}

      # Publish directly to the Ubuntu Snap Store (when SNAPCRAFT_STORE_CREDENTIALS secret is provided)
      - name: Publish to Ubuntu Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: candidate

      # Attach the .snap binary to the GitHub Release draft
      - name: Attach Snap to GitHub Release Draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ${{ steps.snapcraft.outputs.snap }} --clobber || true
